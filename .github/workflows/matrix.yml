name: matrix configuation

on: 
  push:
  workflow_dispatch:
    
jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest,windows-latest]
        node: [18,20]

        exclude:
          - os: ubuntu-latest
            node: 18

        include:
          - os: macos-latest
            node: 20

    runs-on: ${{ matrix.os }}

    steps:
      - run: echo "${{ matrix.os }} - Node ${{ matrix.node }}"
